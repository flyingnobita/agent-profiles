[tools]
"aqua:bats-core/bats-core" = "1.14.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"npm:markdownlint-cli2" = "0.24.0"
"npm:skills" = "1.7.4"

[tasks.test]
description = "Run test suite"
run = "bats -r tests/0*"

[tasks.lint]
description = "Run all linters"
run = """
shell_files=$(find skills tests -type f \\( -name '*.sh' -o -name '*.bash' -o -name 'agent-profiles' -o -name 'check-*' -o -name 'red-run' \\))
shellcheck -x -S style $shell_files
shfmt -d -i 2 -ci -bn $shell_files
markdownlint-cli2 "**/*.md" "!.scratch"
tests/tools/check-package "$PWD"
"""

[tasks.check-install]
description = "Verify clean installation with npx skills"
run = "tests/tools/check-install \"$PWD\""

[tasks.ci]
description = "Full CI verification gate"
depends = ["lint", "test", "check-install"]
