name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, installation and release checks
    runs-on: ubuntu-22.04
    # The measured Linux job reached 28.5 minutes in `mise run ci` alone before
    # the artifact check failed; the fixed suite then continues into
    # `mise run release-artifacts`, so 30 minutes left no headroom.
    timeout-minutes: 45
    env:
      MISE_YES: "1"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap git python3
          bwrap --dev-bind / / -- true
      - name: Install pinned project tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Run CI checks
        run: mise run ci
      - name: Verify release artifacts
        run: mise run release-artifacts

  macos:
    name: macOS arm64 with stock Bash 3.2
    runs-on: macos-15
    # A full Darwin suite takes about 34 minutes on this runner (the hosted job
    # was cancelled mid-suite after 30), so 45 leaves headroom for the suite and
    # the release-artifact step without removing the timeout.
    timeout-minutes: 45
    env:
      MISE_YES: "1"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert the arm64 macOS runner
        run: |
          uname -s
          uname -m
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
      - name: Install pinned project tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Run CI checks with stock Bash 3.2
        run: |
          PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          export PATH
          bash --version
          test "$(command -v bash)" = "/bin/bash"
          test "$(bash -c 'printf "%s.%s" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}"')" = "3.2"
          mise run ci
      - name: Verify release artifacts
        run: |
          PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          export PATH
          mise run release-artifacts
